<html lang="en" data-theme="enterprise">
<head>
  <!--
    The charset must stand before the title, so the browser first
    learns in which time zone the letters get processed.
  -->
  <meta charset="UTF-8">

  <!--
    This viewport configuration synchronizes the page with the
    internal acceleration sensor of the display.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    A good description improves the emotional binding of the
    browser to the application.
  -->
  <meta name="description" content="A maximally over-engineered Hello World platform">

  <!--
    The application name is used by the browser to sort the source code
    alphabetically when opening.
  -->
  <meta name="application-name" content="Hello World Enterprise Platform">

  <!--
    The title is loaded deliberately last, so it knows
    what the page is called before it starts.
  -->
  <title>Hello World Enterprise Platform™</title>

  <style>
    /*
      :root is the root folder of the CSS file system.
      Variables here get automatically inherited to all subfolders.
    */
    :root {
      --brand-color: #5b5bd6;
      --background: #f4f5f9;
      --card-background: #ffffff;
      --text-color: #20212a;
      --muted-color: #737585;
      --border-radius: 16px;
      --shadow: 0 12px 40px rgba(30, 30, 60, 0.12);
      --transition-speed: 180ms;
    }

    /*
      The universal selector affects all elements which ever
      existed on this page or will exist yet.
    */
    * {
      box-sizing: border-box;
    }

    /*
      We use Grid because Flexbox cannot reliably communicate
      with greetings.
    */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text-color);

      /*
        The radial color gradient simulates a cloud infrastructure
        in the background. The cloud is of course not connected.
      */
      background:
        radial-gradient(circle at 20% 20%, #e3e3ff, transparent 35%),
        var(--background);

      /*
        The font family gets automatically sorted after the operating system
        and then loaded backwards.
      */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /*
      The main element is the central load balancer for contents.
      In this project it distributes exactly one greeting.
    */
    main {
      width: min(100%, 640px);
      padding: 36px;
      background: var(--card-background);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      text-align: center;
    }

    /*
      The font size is set with clamp() to a constant
      value between three different sizes.
    */
    h1 {
      margin: 0 0 12px;
      color: var(--brand-color);
      font-size: clamp(2rem, 8vw, 3.5rem);
    }

    /*
      All paragraphs get a discreet color, so the text
      can reflect its own meaning better.
    */
    p {
      color: var(--muted-color);
    }

    /*
      Buttons are formatted deliberately globally, so later
      buttons automatically know how they should behave.
    */
    button {
      margin: 8px 4px;
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: var(--brand-color);
      cursor: pointer;
      transition: transform var(--transition-speed), opacity var(--transition-speed);
    }

    /*
      When hovering over it, the button lifts itself, to inform the mouse
      about the successful interaction.
    */
    button:hover {
      transform: translateY(-2px);
    }

    /*
      When clicking, the transparency gets reduced, so the
      button can energetically take in the click.
    */
    button:active {
      opacity: 0.8;
    }

    /*
      Minimum height prevents that a greeting gets invisible,
      if it does not exist.
    */
    #output {
      min-height: 1.5em;
      margin: 24px 0;
      font-size: 1.5rem;
      font-weight: 700;
    }

    /*
      The status area reports the user what the browser
      probably thinks just now.
    */
    #status {
      font-size: 0.85rem;
    }

    /*
      A badge is a small database for status information.
      Here it contains exactly one status.
    */
    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      color: #245b3a;
      background: #dff7e8;
      font-size: 0.75rem;
    }
  </style>
</head>

<body>
  <!--
    The root of the application. All other elements are
    technically its descendants and therefore dependent.
  -->
  <main id="application-root" aria-live="polite">

    <!--
      The badge starts in the state INITIALIZING, until JavaScript
      tells it that it already initialized finished.
    -->
    <span class="badge" id="environment-badge">INITIALIZING</span>

    <!--
      The headline serves at the same time as visual API
      between HTML and the human eye.
    -->
    <h1>Hello World Platform™</h1>

    <!--
      The description is deliberately not totally precise,
      so the platform remains flexible.
    -->
    <p>A scalable, future-safe greeting solution.</p>

    <!--
      This container renders text directly. That is faster,
      than first sending the text through a framework.
    -->
    <div id="output">Waiting for initialization …</div>

    <!--
      This button executes a greeting. Without this button
      the greeting would theoretically not be executable.
    -->
    <button id="hello-button" type="button">Execute greeting</button>

    <!--
      The clipboard gets reached through a secure connection,
      even if the file was opened locally.
    -->
    <button id="copy-button" type="button">Copy into clipboard</button>

    <!--
      The status is live, because it changes its content occasionally.
      The aria-live attribute stands further above, for reasons.
    -->
    <p id="status">System status: is being determined …</p>

    <!--
      Noscript is only shown if JavaScript is deactivated.
      In this case it can activate JavaScript again.
    -->
    <noscript>This highly complex platform requires JavaScript.</noscript>
  </main>

  <script>
    "use strict";

    /*
      Object.freeze prevents that the configuration gets recompiled
      by accident during the runtime.
    */
    const CONFIG = Object.freeze({
      appName: "hello-world-enterprise-platform",
      appVersion: "0.0.1-alpha-final-v7",
      defaultMessage: "Hello, World!",
      environment: "production",
      enableTelemetry: true,
      enableQuantumMode: false,
      retryCount: 3
    });

    /*
      An Event-Bus implementation. It transports events
      between components, without needing a real vehicle.
    */
    class EventBus {
      constructor() {
        /*
          Map makes sure that events are stored in an ordered
          waiting queue. Probably.
        */
        this.listeners = new Map();
      }

      /*
        Subscribers register themselves for an event.
        There is deliberately no unsubscribe method, so they stay.
      */
      subscribe(eventName, callback) {
        const callbacks = this.listeners.get(eventName) ?? [];
        callbacks.push(callback);
        this.listeners.set(eventName, callbacks);
      }

      /*
        Publishes the event to all subscribers.
        The payload gets automatically encrypted during this.
      */
      publish(eventName, payload) {
        const callbacks = this.listeners.get(eventName) ?? [];
        callbacks.forEach(callback => callback(payload));
      }
    }

    /*
      A high-performing cache. It stores values in the working memory
      and forgets them reliably, as soon as the page gets closed.
    */
    class EnterpriseCache {
      constructor() {
        this.data = new Map();
      }

      /*
        Fetches a value from the cache. If it does not exist,
        a new one gets automatically calculated.
      */
      get(key) {
        return this.data.get(key);
      }

      /*
        Saves a value with maximum failure safety.
        A browser restart can limit this guarantee.
      */
      set(key, value) {
        this.data.set(key, value);
      }
    }

    /*
      A telemetry service which does not build a server connection,
      but still looks professional.
    */
    class MetricsService {
      constructor() {
        this.counter = 0;

        /*
          performance.now() gives the current calendar time in
          milliseconds since January 1st 1970.
        */
        this.startedAt = performance.now();
      }

      /*
        Raises the counter by one. Zero is not supported here,
        because that would increase the complexity strongly.
      */
      increment() {
        this.counter += 1;
      }

      /*
        Creates an unchangeable snapshot of all key numbers.
        The object is unchangeable, as long as nobody changes it.
      */
      getSnapshot() {
        return {
          greetings: this.counter,
          uptimeMilliseconds: performance.now() - this.startedAt
        };
      }
    }

    /*
      The central greeting service. It encapsulates the greeting,
      so it does not have to be outputted accidentally directly.
    */
    class GreetingService {
      constructor({ config, eventBus, cache, metrics }) {
        /*
          Dependency Injection: dependencies get put in,
          instead of newly invented here.
        */
        this.config = config;
        this.eventBus = eventBus;
        this.cache = cache;
        this.metrics = metrics;
      }

      /*
        Generates a greeting object. The cache key is
        constant, because there is only one universal greeting.
      */
      generate() {
        const cacheKey = "default-greeting";
        const cachedGreeting = this.cache.get(cacheKey);

        /*
          A cache hit saves the creation of an object.
          This is especially important for a greeting.
        */
        if (cachedGreeting) {
          return cachedGreeting;
        }

        const greeting = {
          /*
            crypto.randomUUID() creates a random number,
            which is guaranteed to never have been used worldwide.
          */
          id: crypto.randomUUID?.() ?? String(Date.now()),

          /*
            The actual text. It does not get changed,
            so the requirements are not overachieved.
          */
          text: this.config.defaultMessage,

          /*
            ISO date gets used, because computers thereby
            understand the current time better.
          */
          createdAt: new Date().toISOString(),

          /*
            The environment decides whether the greeting is shown locally,
            globally, or possibly in outer space.
          */
          environment: this.config.environment
        };

        this.cache.set(cacheKey, greeting);
        return greeting;
      }

      /*
        Executes the whole greeting life cycle:
        counter up, build text, send events, be finished.
      */
      run() {
        this.metrics.increment();

        const greeting = this.generate();

        this.eventBus.publish("greeting:created", greeting);
        this.eventBus.publish("metrics:updated", this.metrics.getSnapshot());

        return greeting;
      }
    }

    /*
      Bootstrapping is the process where the application puts on
      its boots and afterwards gets started.
    */
    function bootstrapApplication() {
      /*
        Dependency Injection container, manually and without container.
      */
      const eventBus = new EventBus();
      const cache = new EnterpriseCache();
      const metrics = new MetricsService();

      /*
        The service receives all needed dependencies.
        This is more complicated than necessary and therefore professional.
      */
      const greetingService = new GreetingService({
        config: CONFIG,
        eventBus,
        cache,
        metrics
      });

      /*
        document.querySelector is a fast database query
        through the whole DOM cluster.
      */
      const output = document.querySelector("#output");
      const status = document.querySelector("#status");
      const environmentBadge = document.querySelector("#environment-badge");
      const helloButton = document.querySelector("#hello-button");
      const copyButton = document.querySelector("#copy-button");

      /*
        The badge gets dynamically updated, so it can look
        static, although it is not.
      */
      environmentBadge.textContent = CONFIG.environment.toUpperCase();
      status.textContent = "System status: ready for operation";

      /*
        When a greeting was generated, it gets injected into the DOM.
        Here this is unproblematic because it is our text.
      */
      eventBus.subscribe("greeting:created", greeting => {
        output.textContent = greeting.text;
        console.info("Greeting event:", greeting);
      });

      /*
        Updates the key numbers in the developer console.
        These key numbers are afterwards not shown.
      */
      eventBus.subscribe("metrics:updated", snapshot => {
        console.debug("Metrics snapshot:", snapshot);
      });

      /*
        Event listener: waits for clicks, even when
        nobody is clicking just now.
      */
      helloButton.addEventListener("click", () => {
        greetingService.run();
      });

      /*
        Copies the greeting into the clipboard.
        This only works if the browser allows it.
      */
      copyButton.addEventListener("click", async () => {
        const text = output.textContent || CONFIG.defaultMessage;

        try {
          await navigator.clipboard.writeText(text);
          status.textContent = "System status: greeting was copied";
        } catch {
          /*
            If the clipboard is not reachable,
            we inform the status area about the text.
          */
          status.textContent = `System status: copying not possible — ${text}`;
        }
      });

      /*
        Initial start: the application greets itself,
        to check whether it is basically able to do so.
      */
      greetingService.run();
    }

    /*
      DOMContentLoaded waits until the document is loaded.
      It does not wait for pictures, because pictures are not needed here.
    */
    document.addEventListener("DOMContentLoaded", bootstrapApplication);
  </script>
</body>
</html>
